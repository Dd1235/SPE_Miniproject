# Reverse proxy in front of the calculator API replicas.
server {
    listen 80;

    # Docker's embedded DNS. Re-resolving "app" every 10s picks up replicas
    # that were recreated with new IPs; when "app" resolves to several
    # addresses (one per replica), nginx spreads requests across them.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app http://app:8080;

    # Show which replica answered (e.g. X-Upstream: 172.20.0.3:8080)
    add_header X-Upstream $upstream_addr always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout    10s;

    # Public API
    location /api/ {
        proxy_pass $app;
    }

    # App health (used by the Jenkins deploy check). Other actuator
    # endpoints stay private to the backend network.
    location = /actuator/health {
        proxy_pass $app;
    }

    # The proxy's own liveness, for its container health check
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
