spring.application.name=calculator-api

# On SIGTERM (docker stop), stop taking new requests and let in-flight ones finish,
# within Docker's default 10 s stop timeout (after which Docker sends SIGKILL).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=8s

# Actuator: expose only health and info over HTTP.
management.endpoints.web.exposure.include=health,info
# Adds /actuator/health/liveness and /actuator/health/readiness.
management.endpoint.health.probes.enabled=true
# Show info.* properties (below) and build info (version, build time) at /actuator/info.
management.info.env.enabled=true
info.app.environment=${APP_ENVIRONMENT:local}
